<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Round 1 Tournament Bracket</title>
<style>
  :root{--bg:#07090d;--panel:#0e131b;--panel2:#121925;--line:#2a3444;--text:#f7f9fc;--muted:#8d99aa;--accent:#ff4d2e;--accent2:#2ea8ff;--good:#54f28f;--danger:#ff3b30;--shadow:0 20px 60px rgba(0,0,0,.35)}
  *{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 15% 0%,rgba(46,168,255,.08),transparent 28%),radial-gradient(circle at 85% 10%,rgba(255,77,46,.08),transparent 25%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100%}body{min-height:100vh}button,select,input{font:inherit}button{cursor:pointer}.app{max-width:1800px;margin:0 auto;padding:22px}.topbar{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:18px 20px;background:linear-gradient(180deg,rgba(18,25,37,.95),rgba(12,17,25,.95));border:1px solid #1d2837;border-radius:18px;box-shadow:var(--shadow);position:sticky;top:12px;z-index:20;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:14px;min-width:240px}.brand-mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:1000;background:linear-gradient(135deg,var(--accent),#ff9a32);color:white;box-shadow:0 0 30px rgba(255,77,46,.28);font-size:22px;transform:skew(-7deg)}.brand h1{font-size:20px;line-height:1;margin:0 0 5px;text-transform:uppercase;letter-spacing:.08em}.brand p{margin:0;color:var(--muted);font-size:12px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.control,.btn{height:42px;border-radius:11px;border:1px solid #293547;background:#101722;color:var(--text);padding:0 13px}.control:focus,.btn:focus{outline:2px solid rgba(46,168,255,.5);outline-offset:2px}.btn{font-weight:800;letter-spacing:.02em;transition:.18s ease;display:inline-flex;align-items:center;gap:8px}.btn:hover{transform:translateY(-1px);border-color:#3a4d67}.btn.blue{background:linear-gradient(135deg,#1777ff,#2eb5ff);border-color:transparent;box-shadow:0 8px 24px rgba(46,168,255,.16)}.btn.ghost{color:#dce4ef}.btn.danger:hover{border-color:#7d2a27;color:#ff9b92}.status{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:18px 0 14px;padding:0 4px}.hint{color:var(--muted);font-size:13px}.hint b{color:#dce6f2}.legend{display:flex;gap:12px;align-items:center;color:#94a0b0;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}.dot.win{background:var(--accent);box-shadow:0 0 12px rgba(255,77,46,.6)}.dot.loss{background:#596273}.viewport{overflow:auto;border-radius:18px;border:1px solid #182231;background:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px),#090d13;background-size:32px 32px;min-height:720px;box-shadow:inset 0 0 90px rgba(0,0,0,.22)}.bracket{--round-gap:92px;--match-width:340px;display:flex;align-items:stretch;gap:var(--round-gap);min-width:max-content;padding:34px 52px 44px 34px;position:relative}.round{display:flex;flex-direction:column;justify-content:space-around;position:relative;min-width:var(--match-width)}.round-title{position:absolute;top:-23px;left:0;right:0;text-align:center;color:#8f9bad;font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.round-title span{color:#dce7f5}.match{position:relative;width:var(--match-width);background:linear-gradient(180deg,#111925,#0d131d);border:1px solid #202c3c;border-radius:14px;padding:7px;box-shadow:0 10px 24px rgba(0,0,0,.2);transition:.2s ease}.match::after{content:"";position:absolute;right:calc(var(--round-gap) * -1);top:50%;width:var(--round-gap);height:1px;background:var(--line);z-index:0}.round:last-of-type .match::after{display:none}.round:not(:first-of-type) .match::before{content:"";position:absolute;left:calc(var(--round-gap) * -1);top:50%;width:var(--round-gap);height:1px;background:var(--line);z-index:0}.slot{position:relative;z-index:2;display:flex;align-items:center;gap:9px;min-height:44px;padding:7px 9px;border-radius:9px;border:1px solid transparent;color:#eff4fb;transition:.16s ease;user-select:none}.slot+.slot{margin-top:4px}.slot.clickable:hover{background:#182231;border-color:#2f4056}.slot.winner{background:linear-gradient(90deg,rgba(255,77,46,.24),rgba(255,77,46,.05));border-color:rgba(255,99,66,.5);box-shadow:0 0 22px rgba(255,77,46,.17),inset 3px 0 0 var(--accent);color:#fff}.slot.loser{opacity:.38;filter:saturate(.4)}.seed{width:24px;height:24px;border-radius:7px;background:#0a0f16;border:1px solid #263348;color:#77869a;display:grid;place-items:center;font-size:10px;font-weight:900;flex:0 0 auto}.name{min-width:0;flex:1;font-weight:850;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none;border-radius:6px;padding:4px 5px;margin:-4px -5px}input.name{background:transparent;border:0;color:inherit;width:100%;font-weight:850}input.name:hover{background:rgba(255,255,255,.035)}input.name:focus{background:#0b1017;box-shadow:0 0 0 2px rgba(46,168,255,.45);color:#fff}.winmark{opacity:0;color:#ff9a86;font-size:15px;font-weight:1000;transform:scale(.6);transition:.16s ease}.slot.winner .winmark{opacity:1;transform:scale(1)}.reset-match{position:absolute;right:-10px;top:-10px;width:25px;height:25px;border-radius:50%;border:1px solid #34445b;background:#101721;color:#aab5c4;display:none;place-items:center;font-size:13px;z-index:5}.match.has-winner .reset-match{display:grid}.reset-match:hover{color:white;background:#1a2432}.champion{min-width:270px;display:flex;align-items:center;justify-content:center;position:relative}.champ-card{width:255px;min-height:200px;border-radius:22px;padding:22px 18px;text-align:center;border:1px solid #26354a;background:radial-gradient(circle at 50% 0%,rgba(255,130,60,.22),transparent 45%),linear-gradient(180deg,#151d29,#0c1119);box-shadow:0 24px 60px rgba(0,0,0,.4);position:relative;overflow:hidden}.champ-card.active{border-color:rgba(255,108,65,.6);box-shadow:0 0 50px rgba(255,77,46,.18),0 24px 60px rgba(0,0,0,.45)}.trophy{font-size:52px;filter:drop-shadow(0 0 14px rgba(255,149,62,.25));margin-bottom:4px}.champ-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#ff987f;font-weight:1000}.champ-name{font-size:23px;font-weight:1000;letter-spacing:.01em;margin-top:10px;word-break:break-word}.champ-sub{color:#758398;font-size:12px;margin-top:8px}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;width:7px;height:14px;border-radius:2px;opacity:.88;animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(240px) rotate(500deg)}}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#101722;border:1px solid #2d3b50;box-shadow:var(--shadow);padding:11px 14px;border-radius:10px;color:#dfe7f1;font-size:13px;opacity:0;pointer-events:none;transition:.2s ease;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){.app{padding:12px}.topbar{position:relative;top:auto;border-radius:14px}.bracket{--round-gap:64px;--match-width:300px;padding-left:22px}.controls{width:100%}.btn,.control{flex:1;min-width:150px}}
</style>
</head>
<body>
<div class="app"><header class="topbar"><div class="brand"><div class="brand-mark">KO</div><div><h1>Round 1 Tournament</h1><p>8-player single elimination bracket</p></div></div><div class="controls"><select id="teamCount" class="control"><option value="4">4 Teams</option><option value="8" selected>8 Teams</option><option value="16">16 Teams</option><option value="32">32 Teams</option></select><button class="btn blue" id="randomBtn">⚡ Random Team Generator</button><button class="btn ghost" id="clearWinnersBtn">↶ Clear Picks</button><button class="btn danger" id="resetBtn">⟲ Reset Bracket</button></div></header><div class="status"><div class="hint"><b>Rename:</b> click any first-round name box and type. <b>Pick winner:</b> click the team row outside the text box.</div><div class="legend"><span><i class="dot win"></i>Winner</span><span><i class="dot loss"></i>Eliminated</span></div></div><main class="viewport"><section id="bracket" class="bracket"></section></main></div><div id="toast" class="toast"></div>
<script>
(()=>{const TEAM_NAMES=["Crimson Vipers","Iron Wolves","Neon Raiders","Ghost Falcons","Savage Titans","Blackout Kings","Storm Reapers","Inferno Bulls","Night Hawks","Atomic Bears","Thunder Crew","Steel Cobras","Rogue Sharks","Frost Giants","Wild Mustangs","Shadow Lions","Turbo Rhinos","Venom Squad","Chaos Knights","Blaze Panthers","Apex Predators","Redline Raptors","War Hounds","Electric Eagles","Grim Spartans","Dark Phoenix","Bulletproof Badgers","Zero Mercy","Firestorm Foxes","Death Valley Drakes","Midnight Marauders","Riot Ravens","Hellfire Hornets","Titanium Tigers","Blood Moon Bears","Outlaw Owls","Velocity Vikings","Nightmare Ninjas","Rampage Rams","Hardline Hyenas","Omega Orcas","Skull Crushers","Laser Lynx","Combat Coyotes","Blitz Bisons","Rebel Rooks","Steel Serpents","Nova Knights","Bonebreakers","Shockwave Sharks","Wrecking Crew","Red Fury","Blue Inferno","Silent Assassins","Grindhouse Gorillas","Prime Predators","No Quarter","Heavy Hitters","Razorbacks","Final Boss"];let size=8;let teams=["Bender — Le Bandit — 475x — $0.20","Maria — Lady Wolf Moon Mega Wins — 14x — $0.50","fajnipubc — Cursed Crypt — 11.7x — $0.20","imgurgod — Army of Ares — 28x — $0.20","2npc — Alpha Eagle — 24x — $0.20","pusswacker — Dice Bonanza — 111x — $0.20","mid_lanes — Divine Queen Heart of Ice — 172x — $0.40","ju5t4y0u — Bonanza Trillion — 56x — $0.40"];let winners={};const bracketEl=document.getElementById("bracket"),countEl=document.getElementById("teamCount"),toastEl=document.getElementById("toast");const key=(r,m)=>`${r}:${m}`;function defaultTeams(n){return Array.from({length:n},(_,i)=>`Team ${i+1}`)}function toast(msg){toastEl.textContent=msg;toastEl.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove("show"),1600)}function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function roundsCount(){return Math.log2(size)}function getParticipant(r,m,s){if(r===0)return teams[m*2+s]??"";return winners[key(r-1,m*2+s)]?.name??""}function clearForward(r,m){while(r<roundsCount()){delete winners[key(r,m)];m=Math.floor(m/2);r++}}function pickWinner(r,m,s){const a=getParticipant(r,m,0),b=getParticipant(r,m,1);if(!a||!b)return;const selected=s===0?a:b,k=key(r,m),existing=winners[k];if(existing&&existing.side===s){clearForward(r,m);toast("Winner pick removed")}else{clearForward(r,m);winners[k]={name:selected,side:s};toast(`${selected} advances`)}render()}function roundLabel(r){const matches=size/Math.pow(2,r+1);if(matches===1)return"Final";if(matches===2)return"Semifinals";if(matches===4)return"Quarterfinals";return`Round ${r+1}`}function createSlot(r,m,s,name){const slot=document.createElement("div");slot.className="slot"+(name?" clickable":"");const chosen=winners[key(r,m)];if(chosen){slot.classList.add(chosen.side===s?"winner":"loser")}const seed=document.createElement("span");seed.className="seed";seed.textContent=r===0?String(m*2+s+1):"•";let nm;if(r===0){nm=document.createElement("input");nm.className="name";nm.type="text";nm.value=name||"";nm.placeholder=`Team ${m*2+s+1}`;nm.addEventListener("click",e=>e.stopPropagation());nm.addEventListener("mousedown",e=>e.stopPropagation());nm.addEventListener("input",()=>{teams[m*2+s]=nm.value;winners={}});nm.addEventListener("change",()=>{const idx=m*2+s,clean=nm.value.trim()||`Team ${idx+1}`;teams[idx]=clean;nm.value=clean;winners={};render();toast("Team renamed — picks cleared")});nm.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();nm.blur()}})}else{nm=document.createElement("span");nm.className="name";nm.textContent=name||"TBD"}const pick=document.createElement("span");pick.style.cssText="font-size:10px;font-weight:900;letter-spacing:.08em;color:#7f8da1;text-transform:uppercase";pick.textContent=name?"PICK":"";const mark=document.createElement("span");mark.className="winmark";mark.textContent="✓";slot.append(seed,nm,pick,mark);if(name)slot.addEventListener("click",e=>{if(r===0&&e.target===nm)return;pickWinner(r,m,s)});return slot}function createMatch(r,m){const box=document.createElement("div");box.className="match"+(winners[key(r,m)]?" has-winner":"");box.append(createSlot(r,m,0,getParticipant(r,m,0)),createSlot(r,m,1,getParticipant(r,m,1)));const reset=document.createElement("button");reset.className="reset-match";reset.textContent="↶";reset.onclick=e=>{e.stopPropagation();clearForward(r,m);render();toast("Branch reset")};box.append(reset);return box}function champion(){const champ=winners[key(roundsCount()-1,0)]?.name||"",wrap=document.createElement("div"),card=document.createElement("div");wrap.className="champion";card.className="champ-card"+(champ?" active":"");card.innerHTML=`<div class="confetti"></div><div class="trophy">🏆</div><div class="champ-label">Champion</div><div class="champ-name">${champ||"Awaiting Winner"}</div><div class="champ-sub">${champ?"Tournament conquered.":"Finish the final to crown the champion."}</div>`;if(champ){const c=card.querySelector(".confetti"),colors=["#ff4d2e","#ffad32","#2ea8ff","#ffffff","#54f28f"];for(let i=0;i<20;i++){const p=document.createElement("i");p.style.left=Math.random()*100+"%";p.style.top=(-20-Math.random()*160)+"px";p.style.background=colors[i%colors.length];p.style.animationDelay=Math.random()*2+"s";p.style.animationDuration=1.7+Math.random()*1.6+"s";c.append(p)}}wrap.append(card);return wrap}function render(){bracketEl.innerHTML="";bracketEl.style.minHeight=Math.max(650,size*64)+"px";for(let r=0;r<roundsCount();r++){const col=document.createElement("div");col.className="round";const title=document.createElement("div");title.className="round-title";const matches=size/Math.pow(2,r+1);title.innerHTML=`<span>${roundLabel(r)}</span> · ${matches} MATCH${matches===1?"":"ES"}`;col.append(title);for(let m=0;m<matches;m++)col.append(createMatch(r,m));bracketEl.append(col)}bracketEl.append(champion())}function randomize(){teams=shuffle(TEAM_NAMES).slice(0,size);winners={};render();toast(`${size} random teams generated`)}function resetAll(){teams=defaultTeams(size);winners={};render();toast("Bracket reset")}countEl.onchange=()=>{size=Number(countEl.value);teams=defaultTeams(size);winners={};render();toast(`Switched to ${size}-team bracket`)};document.getElementById("randomBtn").onclick=randomize;document.getElementById("clearWinnersBtn").onclick=()=>{winners={};render();toast("All winner picks cleared")};document.getElementById("resetBtn").onclick=()=>{if(confirm("Reset all team names and winner picks?"))resetAll()};winners={"0:0":{name:teams[0],side:0},"0:3":{name:teams[6],side:0}};render()})();
</script>
</body>
</html>
