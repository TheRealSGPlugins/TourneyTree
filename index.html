<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TourneyTree</title>
<style>
:root{--bg:#1f2024;--line:#eeeeee;--text:#ffffff;--accent:#ffd84d;--blue:#3da0ff;--muted:#8f939b}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100%}body{min-height:100vh}.toolbar{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;padding:10px 14px;background:#191a1ddd;border-bottom:1px solid #34363c;backdrop-filter:blur(8px)}button{background:#2a2c31;color:#fff;border:1px solid #44474f;padding:8px 12px;border-radius:6px;font-weight:700;cursor:pointer}button:hover{background:#34373d}.note{margin-left:auto;color:#b0b4bb;font-size:12px}.stage{position:relative;width:1080px;height:860px;background:var(--bg);overflow:hidden}.team{position:absolute;height:34px;display:flex;align-items:flex-end;z-index:5;cursor:pointer}.seed{width:46px;flex:0 0 46px;text-align:right;padding:0 9px 7px 0;font-weight:700;font-size:16px}.teamline{width:200px;height:34px;border-bottom:2px solid var(--line);display:flex;align-items:flex-end;position:relative;padding-bottom:5px}.name{min-width:0;max-width:88px;border:0;outline:0;background:transparent;color:var(--text);font-size:14px;padding:0 3px}.name:first-child{text-align:right}.sep{color:var(--accent);font-weight:900;padding:0 3px;line-height:1}.team.winner .teamline{border-bottom-color:var(--blue)}.team.winner .name{color:#7cbbff;font-weight:700}.team.loser{opacity:.34}.bye .seed{color:#fff}.bye .teamline{border-bottom-color:#f4f4f4}.bye::after{content:"BYE";position:absolute;right:-35px;bottom:7px;color:#7cbbff;font-size:9px;font-weight:800;letter-spacing:.07em}.advance .seed{color:var(--blue)}.advance .name{pointer-events:none}.advance .teamline{cursor:pointer}.h,.v{position:absolute;background:var(--line);z-index:1}.h{height:2px}.v{width:2px}#s1{left:220px;top:28px}#s9{left:20px;top:104px}#s8{left:20px;top:152px}#s5{left:20px;top:204px}#s12{left:20px;top:252px}#s4{left:220px;top:328px}#s3{left:220px;top:433px}#s11{left:20px;top:504px}#s6{left:20px;top:552px}#s7{left:20px;top:604px}#s10{left:20px;top:652px}#s2{left:220px;top:730px}#r9_8{left:220px;top:128px}#r5_12{left:220px;top:228px}#r11_6{left:220px;top:528px}#r7_10{left:220px;top:628px}#qTop1{left:420px;top:78px}#qTop2{left:420px;top:278px}#qBot1{left:420px;top:478px}#qBot2{left:420px;top:678px}#semiTop{left:620px;top:178px}#semiBot{left:620px;top:578px}#final{left:820px;top:378px}#v98{left:218px;top:136px;height:48px}#v512{left:218px;top:236px;height:48px}#v116{left:218px;top:536px;height:48px}#v710{left:218px;top:636px;height:48px}#v1{left:418px;top:60px;height:100px}#h1{left:420px;top:110px;width:200px}#vTop{left:618px;top:110px;height:200px}#h4{left:420px;top:310px;width:200px}#v4{left:418px;top:260px;height:100px}#v3{left:418px;top:460px;height:100px}#h3{left:420px;top:510px;width:200px}#vBot{left:618px;top:510px;height:200px}#h2{left:420px;top:710px;width:200px}#v2{left:418px;top:660px;height:100px}#hST{left:620px;top:210px;width:200px}#vF{left:818px;top:210px;height:400px}#hSB{left:620px;top:610px;width:200px}#hFinal{left:820px;top:410px;width:200px}.champion{position:absolute;left:1020px;top:362px;width:60px;text-align:center}.cup{font-size:38px}.crown{font-size:10px;color:#c7c7c7;margin-top:5px}.champ-name{position:absolute;left:850px;top:434px;width:170px;color:#7dbdff;font-weight:700;font-size:14px;text-align:center}@media(max-width:900px){.note{display:none}.stage{transform-origin:top left}}</style>
</head>
<body>
<div class="toolbar"><button id="clear">Clear Winners</button><button id="reset">Reset Names</button><span class="note">Click a team line to advance it • names are directly editable</span></div>
<div class="stage" id="stage">
<div class="team bye" id="s1" data-seed="1"><div class="seed">1</div><div class="teamline"><input class="name a" value="Wellooee"><span class="sep">|</span><input class="name b" value="Jordan2426"></div></div>
<div class="team" id="s9" data-seed="9"><div class="seed">9</div><div class="teamline"><input class="name a" value="Bender"><span class="sep">|</span><input class="name b" value="Maria 475x"></div></div>
<div class="team" id="s8" data-seed="8"><div class="seed">8</div><div class="teamline"><input class="name a" value="Fajnipubec"><span class="sep">|</span><input class="name b" value="ximurgod97x"></div></div>
<div class="team" id="s5" data-seed="5"><div class="seed">5</div><div class="teamline"><input class="name a" value="2npcs"><span class="sep">|</span><input class="name b" value="pusswacker"></div></div>
<div class="team" id="s12" data-seed="12"><div class="seed">12</div><div class="teamline"><input class="name a" value="Mid_Lanes"><span class="sep">|</span><input class="name b" value="ju5t4y0u"></div></div>
<div class="team bye" id="s4" data-seed="4"><div class="seed">4</div><div class="teamline"><input class="name a" value="tokyodrifixd"><span class="sep">|</span><input class="name b" value="longshot"></div></div>
<div class="team bye" id="s3" data-seed="3"><div class="seed">3</div><div class="teamline"><input class="name a" value="Lejo3jo"><span class="sep">|</span><input class="name b" value="sovietsoulja"></div></div>
<div class="team" id="s11" data-seed="11"><div class="seed">11</div><div class="teamline"><input class="name a" value="KK67Varga"><span class="sep">|</span><input class="name b" value="hunter"></div></div>
<div class="team" id="s6" data-seed="6"><div class="seed">6</div><div class="teamline"><input class="name a" value="Saltykev"><span class="sep">|</span><input class="name b" value="Blink796"></div></div>
<div class="team" id="s7" data-seed="7"><div class="seed">7</div><div class="teamline"><input class="name a" value="Southern"><span class="sep">|</span><input class="name b" value="74mealruns"></div></div>
<div class="team" id="s10" data-seed="10"><div class="seed">10</div><div class="teamline"><input class="name a" value="DK"><span class="sep">|</span><input class="name b" value="danny_b0y"></div></div>
<div class="team bye" id="s2" data-seed="2"><div class="seed">2</div><div class="teamline"><input class="name a" value="Mart1993"><span class="sep">|</span><input class="name b" value="Pedro91"></div></div>
<div class="team advance" id="r9_8"><div class="seed"></div><div class="teamline"><input class="name a" readonly><span class="sep">|</span><input class="name b" readonly></div></div>
<div class="team advance" id="r5_12"><div class="seed"></div><div class="teamline"><input class="name a" readonly><span class="sep">|</span><input class="name b" readonly></div></div>
<div class="team advance" id="r11_6"><div class="seed"></div><div class="teamline"><input class="name a" readonly><span class="sep">|</span><input class="name b" readonly></div></div>
<div class="team advance" id="r7_10"><div class="seed"></div><div class="teamline"><input class="name a" readonly><span class="sep">|</span><input class="name b" readonly></div></div>
<div class="team advance" id="qTop1"><div class="seed"></div><div class="teamline"><input class="name a" readonly><span class="sep">|</span><input class="name b" readonly></div></div>
<div class="team advance" id="qTop2"><div class="seed"></div><div class="teamline"><input class="name a" readonly><span class="sep">|</span><input class="name b" readonly></div></div>
<div class="team advance" id="qBot1"><div class="seed"></div><div class="teamline"><input class="name a" readonly><span class="sep">|</span><input class="name b" readonly></div></div>
<div class="team advance" id="qBot2"><div class="seed"></div><div class="teamline"><input class="name a" readonly><span class="sep">|</span><input class="name b" readonly></div></div>
<div class="team advance" id="semiTop"><div class="seed"></div><div class="teamline"><input class="name a" readonly><span class="sep">|</span><input class="name b" readonly></div></div>
<div class="team advance" id="semiBot"><div class="seed"></div><div class="teamline"><input class="name a" readonly><span class="sep">|</span><input class="name b" readonly></div></div>
<div class="team advance" id="final"><div class="seed"></div><div class="teamline"><input class="name a" readonly><span class="sep">|</span><input class="name b" readonly></div></div>
<div class="v" id="v98"></div><div class="v" id="v512"></div><div class="v" id="v116"></div><div class="v" id="v710"></div><div class="v" id="v1"></div><div class="h" id="h1"></div><div class="v" id="vTop"></div><div class="h" id="h4"></div><div class="v" id="v4"></div><div class="v" id="v3"></div><div class="h" id="h3"></div><div class="v" id="vBot"></div><div class="h" id="h2"></div><div class="v" id="v2"></div><div class="h" id="hST"></div><div class="v" id="vF"></div><div class="h" id="hSB"></div><div class="h" id="hFinal"></div>
<div class="champion"><div class="cup">🏆</div><div class="crown">WINNER</div></div><div class="champ-name" id="champName"></div>
</div>
<script>
const original={};document.querySelectorAll('.team[data-seed]').forEach(t=>{const s=t.dataset.seed;original[s]=[t.querySelector('.a').value,t.querySelector('.b').value]});let picks={};function teamData(id){const el=document.getElementById(id);return[el.querySelector('.a').value.trim(),el.querySelector('.b').value.trim()]}function setTeam(id,data){const el=document.getElementById(id);el.querySelector('.a').value=data?.[0]||'';el.querySelector('.b').value=data?.[1]||''}function clearClasses(ids){ids.forEach(id=>document.getElementById(id).classList.remove('winner','loser'))}function pickBetween(a,b,key,out,nextKeys=[]){const A=document.getElementById(a),B=document.getElementById(b);clearClasses([a,b]);A.onclick=B.onclick=null;const ad=teamData(a),bd=teamData(b);const hasA=ad[0]||ad[1],hasB=bd[0]||bd[1];if(hasA&&hasB){A.onclick=()=>{picks[key]='a';nextKeys.forEach(k=>delete picks[k]);render()};B.onclick=()=>{picks[key]='b';nextKeys.forEach(k=>delete picks[k]);render()}}const p=picks[key];if(p){A.classList.add(p==='a'?'winner':'loser');B.classList.add(p==='b'?'winner':'loser');setTeam(out,p==='a'?ad:bd)}else setTeam(out,['',''])}function render(){pickBetween('s9','s8','r1a','r9_8',['q1','sf1','f']);pickBetween('s5','s12','r1b','r5_12',['q2','sf1','f']);pickBetween('s11','s6','r1c','r11_6',['q3','sf2','f']);pickBetween('s7','s10','r1d','r7_10',['q4','sf2','f']);pickBetween('s1','r9_8','q1','qTop1',['sf1','f']);pickBetween('r5_12','s4','q2','qTop2',['sf1','f']);pickBetween('s3','r11_6','q3','qBot1',['sf2','f']);pickBetween('r7_10','s2','q4','qBot2',['sf2','f']);pickBetween('qTop1','qTop2','sf1','semiTop',['f']);pickBetween('qBot1','qBot2','sf2','semiBot',['f']);pickBetween('semiTop','semiBot','f','final',[]);const champ=teamData('final');document.getElementById('champName').textContent=(champ[0]||champ[1])?champ.join(' | '):''}document.querySelectorAll('.team[data-seed] input').forEach(inp=>{inp.addEventListener('click',e=>e.stopPropagation());inp.addEventListener('input',()=>{picks={};render()})});document.getElementById('clear').onclick=()=>{picks={};render()};document.getElementById('reset').onclick=()=>{document.querySelectorAll('.team[data-seed]').forEach(t=>{const s=t.dataset.seed;t.querySelector('.a').value=original[s][0];t.querySelector('.b').value=original[s][1]});picks={};render()};render();
</script>
</body>
</html>
