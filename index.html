<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TourneyTree Adjustable Preview</title>
<style>
:root{--bg:#171a20;--panel:#1c2028;--line:#24c8ff;--text:#fff;--orange:#ff5b2e;--gold:#ffb51f;--green:#45f39a;--muted:#7f91aa}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 12% 0%,rgba(36,200,255,.12),transparent 28%),radial-gradient(circle at 88% 0%,rgba(255,91,46,.11),transparent 28%),#171a20;color:#fff;font-family:Arial,Helvetica,sans-serif}.toolbar{position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:#11151bdd;border-bottom:1px solid #2b3544;backdrop-filter:blur(10px)}.brand{font-weight:1000;letter-spacing:.09em;margin-right:8px}.brand span{color:var(--orange)}label{font-size:12px;color:#a5b1c2;font-weight:700}select,button{height:38px;border-radius:7px;border:1px solid #33475e;background:#182331;color:#fff;padding:0 11px;font-weight:800}button{cursor:pointer}button:hover,select:focus{border-color:var(--line)}.hint{margin-left:auto;color:#8e9bb0;font-size:12px}.wrap{overflow:auto;padding:22px}.stage{position:relative;width:1420px;min-height:880px;margin:auto;border:1px solid #334154;border-radius:18px;background:linear-gradient(180deg,#1d2027,#1a1d23);box-shadow:0 24px 65px rgba(0,0,0,.34);overflow:hidden}.roundTitle{position:absolute;top:18px;width:220px;text-align:center;color:#8ca7c8;font-size:11px;font-weight:1000;letter-spacing:.15em;text-transform:uppercase;z-index:6}.player{position:absolute;height:34px;display:flex;align-items:flex-end;z-index:5;cursor:pointer}.seed{width:42px;flex:0 0 42px;text-align:right;padding:0 9px 7px 0;font-size:16px;font-weight:1000;color:var(--orange);text-shadow:0 0 8px rgba(255,91,46,.3)}.line{width:220px;height:34px;border-bottom:2px solid var(--line);display:flex;align-items:flex-end;padding-bottom:5px;box-shadow:0 2px 8px rgba(36,200,255,.15)}.name{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:14px;text-align:center;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}input.name:focus{background:#10151d;border-radius:5px;box-shadow:0 0 0 2px rgba(36,200,255,.25)}.player.winner .line{border-bottom-color:var(--green);box-shadow:0 2px 14px rgba(69,243,154,.4)}.player.winner .name{color:var(--green);font-weight:900}.player.loser{opacity:.25}.player.free .seed{color:var(--gold)}.freeBadge{position:absolute;right:2px;top:-10px;font-size:8px;color:var(--gold);font-weight:1000;letter-spacing:.08em}#links{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}#links path{fill:none;stroke:var(--line);stroke-width:2;filter:drop-shadow(0 0 3px rgba(36,200,255,.26))}.champ{position:absolute;right:42px;top:50%;transform:translateY(-50%);width:190px;text-align:center;z-index:7}.cup{font-size:46px;filter:drop-shadow(0 0 12px rgba(255,181,31,.45))}.champLabel{font-size:10px;color:var(--gold);font-weight:1000;letter-spacing:.14em;margin-top:4px}.champName{margin-top:10px;color:var(--green);font-weight:1000;font-size:18px;min-height:22px}.empty{color:#6f7d90}.listPanel{max-width:1420px;margin:18px auto 0;padding:14px 16px;border:1px solid #33475e;border-radius:14px;background:#121923}.listPanel h3{margin:0 0 8px;font-size:15px}.listPanel textarea{width:100%;min-height:120px;resize:vertical;border:1px solid #33475e;border-radius:9px;background:#0d131c;color:#fff;padding:11px;outline:none}.listPanel textarea:focus{border-color:var(--line)}.listActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px}#makeBoxes{background:linear-gradient(135deg,#167ee4,#26bfff);border-color:#26bfff}#nameBoxes{max-width:1420px;margin:12px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.personBox{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #32455d;border-radius:10px;background:#111a25}.personNum{width:25px;height:25px;border-radius:7px;display:grid;place-items:center;background:#0b1119;color:var(--orange);font-size:11px;font-weight:1000;flex:none}.personBox input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-weight:800}.personBox input:focus{background:#0b1119;border-radius:5px}.boxActions{max-width:1420px;margin:10px auto 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}#randomizeBoxes{background:linear-gradient(135deg,#ff6035,#ff9a32);border-color:#ff7b36}#boxStatus{color:#8e9bb0;font-size:12px}@keyframes flashUpdate{0%{transform:scale(1)}50%{transform:scale(1.015)}100%{transform:scale(1)}}.updated{animation:flashUpdate .25s ease}@media(max-width:900px){.hint{display:none}.wrap{padding:8px}.listPanel,#nameBoxes,.boxActions{margin-left:8px;margin-right:8px}}</style>
</head>
<body>
<div class="toolbar"><div class="brand"><span>TOURNEY</span>TREE PREVIEW</div><label for="teamCount">Entrants</label><select id="teamCount"><option value="4">4</option><option value="8">8</option><option value="12" selected>12</option><option value="16">16</option><option value="32">32</option></select><button id="shuffle">Randomize Seeding</button><button id="clear">Clear Winners</button><button id="reset">Reset Names</button><div class="hint">Click a name line to advance • click a starting name to edit it</div></div>
<div class="listPanel"><h3>Paste Names</h3><textarea id="rawNames" placeholder="Bender&#10;Maria&#10;fajnipubc&#10;imgurgod&#10;2npc&#10;pusswacker"></textarea><div class="listActions"><button id="makeBoxes">Make Player Boxes</button><span id="parseStatus" style="color:#8e9bb0;font-size:12px">One player per line.</span></div></div><div id="nameBoxes"></div><div class="boxActions"><button id="randomizeBoxes">🎲 Randomize Into Bracket</button><button id="clearBoxes">Clear Player Boxes</button><span id="boxStatus">Create player boxes first.</span></div>
<div class="wrap"><div class="stage" id="stage"><svg id="links"></svg><div id="titles"></div><div id="players"></div><div class="champ"><div class="cup">🏆</div><div class="champLabel">WINNER</div><div class="champName empty" id="champName">Awaiting Winner</div></div></div></div>
<script>
const defaults12=["Wellooee | Jordan2426","Bender | Maria 475x","Fajnipubec | ximurgod97x","2npcs | pusswacker","Mid_Lanes | ju5t4y0u","tokyodrifixd | longshot","Lejo3jo | sovietsoulja","KK67Varga | hunter","Saltykev | Blink796","Southern | 74mealruns","DK | danny_b0y","Mart1993 | Pedro91"];const generatedPool=["Crimson Vipers","Iron Wolves","Neon Raiders","Ghost Falcons","Savage Titans","Blackout Kings","Storm Reapers","Inferno Bulls","Night Hawks","Atomic Bears","Thunder Crew","Steel Cobras","Rogue Sharks","Frost Giants","Wild Mustangs","Shadow Lions","Turbo Rhinos","Venom Squad","Chaos Knights","Blaze Panthers","Apex Predators","Redline Raptors","War Hounds","Electric Eagles","Grim Spartans","Dark Phoenix","Zero Mercy","Riot Ravens","Omega Orcas","Nova Knights","Final Boss","Heavy Hitters"];let entrantCount=12;let entrants=[...defaults12];let original=[...defaults12];let picks={};const stage=document.getElementById("stage"),playerLayer=document.getElementById("players"),titleLayer=document.getElementById("titles"),svg=document.getElementById("links");function nextPow2(n){let p=1;while(p<n)p*=2;return p}function roundsFor(n){return Math.log2(nextPow2(n))}function bracketSlots(n){return nextPow2(n)}function freeWinCount(n){return bracketSlots(n)-n}function seedOrder(size){let arr=[1,2];while(arr.length<size){const sum=arr.length*2+1;arr=arr.flatMap(x=>[x,sum-x])}return arr}function getRoundLabel(round,total){const matches=bracketSlots(entrantCount)/Math.pow(2,round+1);if(matches===1)return"FINAL";if(matches===2)return"SEMIFINALS";if(matches===4)return"QUARTERFINALS";return round===0?"OPENING ROUND":`ROUND ${round+1}`}function key(r,m){return`${r}:${m}`}function buildInitialSlots(){const size=bracketSlots(entrantCount);const order=seedOrder(size);const seedToName={};entrants.forEach((name,i)=>seedToName[i+1]=name);const slots=order.map(seed=>({seed,name:seedToName[seed]||"",free:false}));for(let i=0;i<slots.length;i+=2){if(slots[i].name&&!slots[i+1].name)slots[i].free=true;if(slots[i+1].name&&!slots[i].name)slots[i+1].free=true}return slots}function resolvedWinner(r,m){return picks[key(r,m)]?.name||""}function participant(r,m,s,initial){if(r===0)return initial[m*2+s]||{name:"",seed:"",free:false};return{name:resolvedWinner(r-1,m*2+s),seed:"",free:false}}function autoAdvanceByes(initial){const matches=bracketSlots(entrantCount)/2;for(let m=0;m<matches;m++){const a=initial[m*2],b=initial[m*2+1];if(a.name&&!b.name)picks[key(0,m)]={name:a.name,side:0,auto:true};else if(b.name&&!a.name)picks[key(0,m)]={name:b.name,side:1,auto:true}}}function clearForward(r,m){const rounds=roundsFor(entrantCount);while(r<rounds){delete picks[key(r,m)];m=Math.floor(m/2);r++}}function choose(r,m,s,initial){const A=participant(r,m,0,initial),B=participant(r,m,1,initial);if(!A.name||!B.name)return;const cur=picks[key(r,m)];if(cur&&!cur.auto&&cur.side===s)clearForward(r,m);else{clearForward(r,m);picks[key(r,m)]={name:s===0?A.name:B.name,side:s,auto:false}}autoAdvanceByes(initial);render()}function addTitle(text,x){const d=document.createElement("div");d.className="roundTitle";d.style.left=x+"px";d.textContent=text;titleLayer.appendChild(d)}function makePlayer({id,x,y,seed,name,editable,free,r,m,s,initial}){const d=document.createElement("div");d.className="player"+(free?" free":"");d.id=id;d.style.left=x+"px";d.style.top=y+"px";const p=picks[key(r,m)];if(p&&name){if(p.name===name)d.classList.add("winner");else if(participant(r,m,1-s,initial).name)d.classList.add("loser")}const sd=document.createElement("div");sd.className="seed";sd.textContent=seed||"";const line=document.createElement("div");line.className="line";let nm;if(editable&&name){nm=document.createElement("input");nm.className="name";nm.value=name;nm.addEventListener("click",e=>e.stopPropagation());nm.addEventListener("change",()=>{const idx=entrants.indexOf(name);if(idx>=0)entrants[idx]=nm.value.trim()||name;picks={};render()})}else{nm=document.createElement("div");nm.className="name";nm.textContent=name||""}line.appendChild(nm);d.append(sd,line);if(free){const b=document.createElement("span");b.className="freeBadge";b.textContent="FREE WIN";d.appendChild(b)}if(name&&!(r===0&&p?.auto))d.addEventListener("click",()=>choose(r,m,s,initial));playerLayer.appendChild(d);return d}function render(){playerLayer.innerHTML="";titleLayer.innerHTML="";svg.innerHTML="";const size=bracketSlots(entrantCount),rounds=roundsFor(entrantCount);const initial=buildInitialSlots();autoAdvanceByes(initial);const startX=35,lineYTop=70,contentHeight=Math.max(720,size*44);stage.style.height=contentHeight+90+"px";const effectiveGap=Math.min(285,(1160-startX)/rounds);for(let r=0;r<rounds;r++)addTitle(getRoundLabel(r,rounds),startX+r*effectiveGap);addTitle("CHAMPION",startX+rounds*effectiveGap);for(let r=0;r<rounds;r++){const count=size/Math.pow(2,r+1),stride=contentHeight/count,x=startX+r*effectiveGap;for(let m=0;m<count;m++){const center=lineYTop+stride*(m+.5),pairOffset=Math.min(26,stride*.22);for(let s=0;s<2;s++){const part=participant(r,m,s,initial),y=center+(s===0?-pairOffset:pairOffset)-17,id=`p-${r}-${m}-${s}`;makePlayer({id,x,y,seed:r===0&&part.name?part.seed:"",name:part.name,editable:r===0,free:r===0&&part.free,r,m,s,initial})}}}requestAnimationFrame(()=>{const sr=stage.getBoundingClientRect();for(let r=0;r<rounds-1;r++){const count=size/Math.pow(2,r+1);for(let m=0;m<count;m++){const from=document.getElementById(`p-${r}-${m}-0`),from2=document.getElementById(`p-${r}-${m}-1`);if(!from||!from2)continue;const target=document.getElementById(`p-${r+1}-${Math.floor(m/2)}-${m%2}`);if(!target)continue;const A=from.getBoundingClientRect(),B=from2.getBoundingClientRect(),T=target.getBoundingClientRect(),x1=Math.max(A.right,B.right)-sr.left,y1=(A.bottom+B.bottom)/2-sr.top,x2=T.left-sr.left+42,y2=T.bottom-sr.top,xm=x1+(x2-x1)*.5,p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",`M ${x1} ${y1} H ${xm} V ${y2} H ${x2}`);svg.appendChild(p)}}});const champ=resolvedWinner(rounds-1,0),cn=document.getElementById("champName");cn.textContent=champ||"Awaiting Winner";cn.classList.toggle("empty",!champ)}document.getElementById("teamCount").addEventListener("change",e=>{entrantCount=Number(e.target.value);if(entrantCount===12)entrants=[...defaults12];else entrants=Array.from({length:entrantCount},(_,i)=>generatedPool[i]||`Player ${i+1}`);original=[...entrants];picks={};render()});document.getElementById("shuffle").addEventListener("click",()=>{entrants=[...entrants].sort(()=>Math.random()-.5);picks={};render()});document.getElementById("clear").addEventListener("click",()=>{picks={};render()});document.getElementById("reset").addEventListener("click",()=>{entrants=[...original];picks={};render()});
function fisherYates(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function currentBoxNames(){return[...document.querySelectorAll("#nameBoxes .personBox input")].map(i=>i.value.trim()).filter(Boolean)}function syncEntrantSelect(n){const sel=document.getElementById("teamCount");[...sel.options].filter(o=>o.dataset.custom==="1").forEach(o=>o.remove());let opt=[...sel.options].find(o=>Number(o.value)===n);if(!opt){opt=document.createElement("option");opt.value=String(n);opt.textContent=`${n} (Custom)`;opt.dataset.custom="1";sel.appendChild(opt)}sel.value=String(n)}function flash(el){if(!el)return;el.classList.remove("updated");void el.offsetWidth;el.classList.add("updated")}function buildBoxes(names){const wrap=document.getElementById("nameBoxes");wrap.innerHTML="";names.forEach((name,idx)=>{const box=document.createElement("div");box.className="personBox";const num=document.createElement("span");num.className="personNum";num.textContent=String(idx+1);const inp=document.createElement("input");inp.value=name;inp.placeholder=`Player ${idx+1}`;box.append(num,inp);wrap.appendChild(box)});flash(wrap)}document.getElementById("makeBoxes").addEventListener("click",()=>{const names=[...new Set(document.getElementById("rawNames").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];const status=document.getElementById("parseStatus");if(names.length<2){status.textContent="Enter at least 2 names.";return}if(names.length>32){status.textContent="Maximum is 32 names.";return}buildBoxes(names);status.textContent=`Created ${names.length} editable player boxes.`;document.getElementById("boxStatus").textContent="Ready to randomize."});document.getElementById("randomizeBoxes").addEventListener("click",()=>{const names=currentBoxNames(),status=document.getElementById("boxStatus");if(names.length<2){status.textContent="Make the player boxes first.";return}const shuffled=fisherYates(names);buildBoxes(shuffled);entrantCount=shuffled.length;entrants=[...shuffled];original=[...names];picks={};syncEntrantSelect(entrantCount);render();flash(document.getElementById("stage"));status.textContent=`Randomized ${entrantCount} players — click again to reshuffle.`});document.getElementById("clearBoxes").addEventListener("click",()=>{document.getElementById("nameBoxes").innerHTML="";document.getElementById("boxStatus").textContent="Player boxes cleared."});window.addEventListener("resize",render);render();
</script>
</body>
</html>
