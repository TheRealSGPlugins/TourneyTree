</style></head><body><div class="toolbar"><button id="clear">Clear Winners</button><button id="reset">Reset Names</button><span class="note">Click a team line to advance it • names are directly editable</span></div><div class="stage" id="stage"><div class="hdr" style="left:45px">OPENING ROUND</div><div class="hdr" style="left:285px">ROUND 2</div><div class="hdr" style="left:535px">QUARTERFINALS</div><div class="hdr" style="left:785px">SEMIFINALS</div><div class="hdr" style="left:1035px">FINAL</div>

const stage=document.getElementById('stage'),defs=[['r9_8',250,145],['r5_12',250,270],['r11_6',250,590],['r7_10',250,715],['qTop1',500,92],['qTop2',500,322],['qBot1',500,537],['qBot2',500,767],['semiTop',750,207],['semiBot',750,652],['final',1000,430]];defs.forEach(([id,l,t])=>{let d=document.createElement('div');d.className='team advance';d.id=id;d.style.left=l+'px';d.style.top=t+'px';d.innerHTML='<div class="seed"></div><div class="teamline"><input class="name a" readonly><span class="sep">|</span><input class="name b" readonly></div>';stage.appendChild(d)});let picks={};const original={};document.querySelectorAll('.team[data-seed]').forEach(t=>original[t.dataset.seed]=[t.querySelector('.a').value,t.querySelector('.b').value]);function data(id){let e=document.getElementById(id);return[e.querySelector('.a').value.trim(),e.querySelector('.b').value.trim()]}function set(id,d){let e=document.getElementById(id);e.querySelector('.a').value=d?.[0]||'';e.querySelector('.b').value=d?.[1]||''}function game(a,b,k,o,clear=[]){let A=document.getElementById(a),B=document.getElementById(b),ad=data(a),bd=data(b);A.classList.remove('winner','loser');B.classList.remove('winner','loser');A.onclick=()=>{picks[k]='a';clear.forEach(x=>delete picks[x]);render()};B.onclick=()=>{picks[k]='b';clear.forEach(x=>delete picks[x]);render()};let p=picks[k];if(p){A.classList.add(p==='a'?'winner':'loser');B.classList.add(p==='b'?'winner':'loser');set(o,p==='a'?ad:bd)}else set(o,['',''])}function lines(){let svg=document.getElementById('treeSvg');svg.innerHTML='';let sr=stage.getBoundingClientRect();[['s9','s8','r9_8'],['s5','s12','r5_12'],['s11','s6','r11_6'],['s7','s10','r7_10'],['s1','r9_8','qTop1'],['r5_12','s4','qTop2'],['s3','r11_6','qBot1'],['r7_10','s2','qBot2'],['qTop1','qTop2','semiTop'],['qBot1','qBot2','semiBot'],['semiTop','semiBot','final']].forEach(([a,b,o])=>{let A=document.getElementById(a).getBoundingClientRect(),B=document.getElementById(b).getBoundingClientRect(),O=document.getElementById(o).getBoundingClientRect(),x=Math.max(A.right,B.right)-sr.left,y1=A.bottom-sr.top,y2=B.bottom-sr.top,xo=O.left-sr.left+46,ym=(y1+y2)/2,xm=(x+xo)/2,p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x},${y1}H${xm}V${y2}H${x}M${xm},${ym}H${xo}`);svg.appendChild(p)})}function render(){game('s9','s8','a','r9_8',['e','i','k']);game('s5','s12','b','r5_12',['f','i','k']);game('s11','s6','c','r11_6',['g','j','k']);game('s7','s10','d','r7_10',['h','j','k']);game('s1','r9_8','e','qTop1',['i','k']);game('r5_12','s4','f','qTop2',['i','k']);game('s3','r11_6','g','qBot1',['j','k']);game('r7_10','s2','h','qBot2',['j','k']);game('qTop1','qTop2','i','semiTop',['k']);game('qBot1','qBot2','j','semiBot',['k']);game('semiTop','semiBot','k','final',[]);let c=data('final');document.getElementById('champName').textContent=c[0]||c[1]?c.join(' | '):'';requestAnimationFrame(lines)}document.querySelectorAll('.team[data-seed] input').forEach(i=>{i.onclick=e=>e.stopPropagation();i.oninput=()=>{picks={};render()}});document.getElementById('clear').onclick=()=>{picks={};render()};document.getElementById('reset').onclick=()=>{document.querySelectorAll('.team[data-seed]').forEach(t=>{let d=original[t.dataset.seed];t.querySelector('.a').value=d[0];t.querySelector('.b').value=d[1]});picks={};render()};render();</script></body></html>
