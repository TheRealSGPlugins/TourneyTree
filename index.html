<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TourneyTree</title>
<style>
:root{--blue:#1f6ed4;--line:#b9b9b9;--text:#232323;--muted:#6f6f6f;--paper:#fff}
*{box-sizing:border-box}body{margin:0;background:#efefef;font-family:Arial,Helvetica,sans-serif;color:var(--text)}
.toolbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{border:1px solid #c8c8c8;background:#fff;padding:8px 12px;border-radius:6px;font-weight:700;cursor:pointer}
button:hover{background:#f5f5f5}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.sheet{width:1500px;min-height:950px;margin:24px auto;background:var(--paper);box-shadow:0 2px 14px #0002;padding:70px 70px 55px}
.titlebar{background:#eaf3ff;padding:15px 18px;font-size:24px;color:#28425f;margin:-70px -70px 46px}
.meta{margin-bottom:34px}.meta h1{font-size:24px;margin:0 0 12px}.meta input{border:0;border-bottom:2px solid #aaa;font-size:16px;padding:4px 0;width:230px;outline:0}.meta input:focus{border-color:var(--blue)}
.bracket{display:grid;grid-template-columns:320px 160px 320px 160px 320px 160px 260px;column-gap:0;align-items:stretch;position:relative}
.round{position:relative;min-height:700px}.r1{grid-column:1}.r2{grid-column:3}.r3{grid-column:5}.champ{grid-column:7;display:flex;align-items:center;justify-content:center}
.match{position:absolute;width:100%;height:76px}.slot{height:32px;display:flex;align-items:flex-end;gap:8px;border-bottom:2px solid var(--line);position:relative}.slot+.slot{margin-top:12px}
.seed{width:24px;text-align:right;font-size:16px;color:#222;flex:none}.name{border:0;outline:0;font-size:16px;font-weight:500;background:transparent;min-width:0;flex:1;padding:0 3px 2px}.name:focus{background:#f2f7ff}
.score{width:38px;height:25px;border:0;background:#e9f3ff;text-align:center;font-size:15px;outline:0}.slot.winner{border-bottom-color:var(--blue)}.slot.winner .name,.slot.winner .label{color:var(--blue);font-weight:700}.slot.loser{opacity:.35}
.label{flex:1;padding:0 3px 2px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bye{color:var(--blue);font-size:11px;font-weight:700;margin-left:4px}.champbox{text-align:center;width:220px}.cup{font-size:48px}.champname{font-size:20px;font-weight:800;color:var(--blue);margin-top:10px;min-height:28px}.small{color:#777;font-size:12px;margin-top:6px}
.link{position:absolute;height:2px;background:var(--line)}.vert{position:absolute;width:2px;background:var(--line)}
.r1 .m0{top:30px}.r1 .m1{top:165px}.r1 .m2{top:375px}.r1 .m3{top:510px}.r2 .m0{top:85px}.r2 .m1{top:235px}.r2 .m2{top:405px}.r2 .m3{top:555px}.r3 .m0{top:180px}.r3 .m1{top:470px}.final{position:absolute;top:320px;width:100%}
.l10{left:320px;top:90px;width:80px}.v10{left:398px;top:90px;height:113px}.l11{left:320px;top:225px;width:80px}.l12{left:320px;top:435px;width:80px}.v12{left:398px;top:435px;height:113px}.l13{left:320px;top:570px;width:80px}
.s0a{left:800px;top:145px;width:80px}.s0v{left:878px;top:145px;height:150px}.s0b{left:800px;top:295px;width:80px}.s1a{left:800px;top:465px;width:80px}.s1v{left:878px;top:465px;height:150px}.s1b{left:800px;top:615px;width:80px}
.f0a{left:1120px;top:240px;width:80px}.f0v{left:1198px;top:240px;height:290px}.f0b{left:1120px;top:530px;width:80px}.fout{left:1198px;top:384px;width:82px}
@media(max-width:900px){body{overflow:auto}.sheet{margin:0}}
</style>
</head>
<body>
<div class="toolbar"><button id="randomNames" class="primary">Randomize Empty Names</button><button id="clearPicks">Clear Winners</button><button id="resetAll">Reset Bracket</button></div>
<div class="sheet">
<div class="titlebar">SINGLE ELIMINATION TOURNAMENT BRACKET FOR 12 PLAYERS</div>
<div class="meta"><h1><input id="eventName" value="Tournament Name"></h1><input id="eventDate" value="08/08/2026"></div>
<div class="bracket" id="bracket">
<section class="round r1" id="round1"></section><section class="round r2" id="round2"></section><section class="round r3" id="round3"></section>
<section class="champ"><div class="champbox"><div class="cup">🏆</div><div>CHAMPION</div><div class="champname" id="champName">Awaiting Winner</div><div class="small">Click winners to advance</div></div></section>
<div class="link l10"></div><div class="vert v10"></div><div class="link l11"></div><div class="link l12"></div><div class="vert v12"></div><div class="link l13"></div>
<div class="link s0a"></div><div class="vert s0v"></div><div class="link s0b"></div><div class="link s1a"></div><div class="vert s1v"></div><div class="link s1b"></div>
<div class="link f0a"></div><div class="vert f0v"></div><div class="link f0b"></div><div class="link fout"></div>
</div></div>
<script>
const firstRound=["Bender - Le Bandit - 475x - .20 denomination","Maria - Lady Wolf Moon Mega Wins - 14x - .50 denomination","fajnipubc - Cursed Crypt - 11.7x - .20 denomination","imgurgod - Army of Ares - 28x - .20 denomination","2npc - Alpha Eagle - 24x - .20 denomination","pusswacker - Dice Bonanza - 111x - .20 denomination","mid_lanes - Divine Queen Heart of Ice - 172x - .40 denomination","ju5t4y0u - Bonanza Trillion - 56x - .40 denomination"];
let bye=["FREE WIN 1","FREE WIN 2","FREE WIN 3","FREE WIN 4"],winners={};const randomPool=["Iron Wolves","Neon Raiders","Storm Reapers","Ghost Falcons","Savage Titans","Night Hawks","Steel Cobras","Apex Raiders","Venom Squad","Rogue Kings","Blaze Crew","Thunder Hawks"];
function key(r,m){return r+":"+m}function clearForward(r,m){while(r<4){delete winners[key(r,m)];m=Math.floor(m/2);r++}}
function get(r,m,s){if(r===0)return firstRound[m*2+s]||"";if(r===1){const prior=winners[key(0,m)]?.name||"";return m%2===0?(s===0?bye[m/2]:prior):(s===0?prior:bye[Math.floor(m/2)])}return winners[key(r-1,m*2+s)]?.name||""}
function choose(r,m,s){const a=get(r,m,0),b=get(r,m,1);if(!a||!b)return;const kk=key(r,m),cur=winners[kk];if(cur&&cur.side===s){clearForward(r,m)}else{clearForward(r,m);winners[kk]={name:s?b:a,side:s}}render()}
function makeSlot(r,m,s,name,editable,isBye){const row=document.createElement("div");row.className="slot";const p=winners[key(r,m)];if(p)row.classList.add(p.side===s?"winner":"loser");const seed=document.createElement("span");seed.className="seed";seed.textContent=r===0?(m*2+s+1):"";row.append(seed);if(editable){const inp=document.createElement("input");inp.className="name";inp.value=name;inp.onclick=e=>e.stopPropagation();inp.onchange=()=>{if(r===0)firstRound[m*2+s]=inp.value.trim()||("Player "+(m*2+s+1));else bye[Math.floor(m/2)]=inp.value.trim()||("FREE WIN "+(Math.floor(m/2)+1));winners={};render()};row.append(inp);if(isBye){const t=document.createElement("span");t.className="bye";t.textContent="BYE";row.append(t)}}else{const lab=document.createElement("span");lab.className="label";lab.textContent=name||"TBD";row.append(lab)}const score=document.createElement("input");score.className="score";score.onclick=e=>e.stopPropagation();row.append(score);if(name)row.onclick=()=>choose(r,m,s);return row}
function makeMatch(r,m,cls){const box=document.createElement("div");box.className="match "+cls;for(let s=0;s<2;s++){const isBye=r===1&&((m%2===0&&s===0)||(m%2===1&&s===1));box.append(makeSlot(r,m,s,get(r,m,s),r===0||isBye,isBye))}return box}
function render(){const r1=document.getElementById("round1"),r2=document.getElementById("round2"),r3=document.getElementById("round3");r1.innerHTML="";r2.innerHTML="";r3.innerHTML="";for(let m=0;m<4;m++)r1.append(makeMatch(0,m,"m"+m));for(let m=0;m<4;m++)r2.append(makeMatch(1,m,"m"+m));for(let m=0;m<2;m++)r3.append(makeMatch(2,m,"m"+m));r3.append(makeMatch(3,0,"final"));document.getElementById("champName").textContent=winners[key(3,0)]?.name||"Awaiting Winner"}
document.getElementById("clearPicks").onclick=()=>{winners={};render()};document.getElementById("resetAll").onclick=()=>{if(confirm("Reset all names and winners?")){winners={};bye=["FREE WIN 1","FREE WIN 2","FREE WIN 3","FREE WIN 4"];render()}};document.getElementById("randomNames").onclick=()=>{const a=[...randomPool].sort(()=>Math.random()-.5);for(let i=0;i<4;i++)if(bye[i].startsWith("FREE WIN"))bye[i]=a[i];render()};winners={"0:0":{name:firstRound[0],side:0},"0:3":{name:firstRound[6],side:0}};render();
</script></body></html>
