<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tourney Brackets By SouthernG</title>
<style>
:root{--bg:#171a20;--panel:#1c2028;--line:#24c8ff;--text:#fff;--orange:#ff5b2e;--gold:#ffb51f;--green:#45f39a;--muted:#7f91aa}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 12% 0%,rgba(36,200,255,.12),transparent 28%),radial-gradient(circle at 88% 0%,rgba(255,91,46,.11),transparent 28%),#171a20;color:#fff;font-family:Arial,Helvetica,sans-serif}.toolbar{position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:#11151bdd;border-bottom:1px solid #2b3544;backdrop-filter:blur(10px)}.brand{font-weight:1000;letter-spacing:.09em;margin-right:8px}.brand span{color:var(--orange)}label{font-size:12px;color:#a5b1c2;font-weight:700}select,button{height:38px;border-radius:7px;border:1px solid #33475e;background:#182331;color:#fff;padding:0 11px;font-weight:800}button{cursor:pointer}.hint{margin-left:auto;color:#8e9bb0;font-size:12px}.listPanel{max-width:1420px;margin:18px auto 0;padding:14px 16px;border:1px solid #33475e;border-radius:14px;background:#121923}.listPanel h3{margin:0 0 8px;font-size:15px}.listPanel textarea{width:100%;min-height:125px;resize:vertical;border:1px solid #33475e;border-radius:9px;background:#0d131c;color:#fff;padding:11px;outline:none}.listActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px}#randomizeDirect{background:linear-gradient(135deg,#ff6035,#ff9a32);border-color:#ff7b36}#listStatus{color:#dce7f4;font-size:12px;font-weight:800}.wrap{overflow:auto;padding:22px}.stage{position:relative;width:1420px;min-height:880px;margin:auto;border:1px solid #334154;border-radius:18px;background:linear-gradient(180deg,#1d2027,#1a1d23);overflow:hidden}.roundTitle{position:absolute;top:18px;width:220px;text-align:center;color:#8ca7c8;font-size:11px;font-weight:1000;letter-spacing:.15em;text-transform:uppercase;z-index:6}.player{position:absolute;height:34px;display:flex;align-items:flex-end;z-index:5;cursor:pointer}.seed{width:42px;flex:0 0 42px;text-align:right;padding:0 9px 7px 0;font-size:16px;font-weight:1000;color:var(--orange)}.line{width:220px;height:34px;border-bottom:2px solid var(--line);display:flex;align-items:flex-end;padding-bottom:5px}.name{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:14px;text-align:center;padding:0 5px}.player.winner .line{border-bottom-color:var(--green)}.player.winner .name{color:var(--green);font-weight:900}.player.loser{opacity:.25}.player.free .seed{color:var(--gold)}.freeBadge{position:absolute;right:2px;top:-10px;font-size:8px;color:var(--gold);font-weight:1000}#links{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}#links path{fill:none;stroke:var(--line);stroke-width:2}.champ{position:absolute;right:42px;top:50%;transform:translateY(-50%);width:190px;text-align:center;z-index:7}.cup{font-size:46px}.champLabel{font-size:10px;color:var(--gold);font-weight:1000;letter-spacing:.14em}.champName{margin-top:10px;color:var(--green);font-weight:1000;font-size:18px}.empty{color:#6f7d90}
</style>
</head>
<body>
<div class="toolbar"><div class="brand"><span>TOURNEY BRACKETS</span> BY SOUTHERNG</div><label for="teamCount">Entrants</label><select id="teamCount"><option value="4">4</option><option value="8">8</option><option value="12" selected>12</option><option value="16">16</option><option value="32">32</option></select><button id="clear">Clear Winners</button><button id="reset">Reset Draw</button><div class="hint">Blank on load → select entrants → paste the same number of names → randomize</div></div>
<div class="listPanel"><h3>Paste Names</h3><textarea id="rawNames" placeholder="One player per line"></textarea><div class="listActions"><button id="randomizeDirect">🎲 Randomize Into Bracket</button><span id="listStatus">Selected: 12 entrants • Names entered: 0</span></div></div>
<div class="wrap"><div class="stage" id="stage"><svg id="links"></svg><div id="titles"></div><div id="players"></div><div class="champ"><div class="cup">🏆</div><div class="champLabel">WINNER</div><div class="champName empty" id="champName">Awaiting Winner</div></div></div></div>
<script>
let entrantCount=12;let entrants=Array(entrantCount).fill("");let original=[];let picks={};
const stage=document.getElementById("stage"),playerLayer=document.getElementById("players"),titleLayer=document.getElementById("titles"),svg=document.getElementById("links");
function nextPow2(n){let p=1;while(p<n)p*=2;return p}function roundsFor(n){return Math.log2(nextPow2(n))}function bracketSlots(n){return nextPow2(n)}function seedOrder(size){let arr=[1,2];while(arr.length<size){const sum=arr.length*2+1;arr=arr.flatMap(x=>[x,sum-x])}return arr}function getRoundLabel(round){const matches=bracketSlots(entrantCount)/Math.pow(2,round+1);if(matches===1)return"FINAL";if(matches===2)return"SEMIFINALS";if(matches===4)return"QUARTERFINALS";return round===0?"OPENING ROUND":`ROUND ${round+1}`}function key(r,m){return`${r}:${m}`}
function buildInitialSlots(){const size=bracketSlots(entrantCount),order=seedOrder(size),seedToName={};entrants.forEach((name,i)=>seedToName[i+1]=name);const slots=order.map(seed=>({seed,name:seedToName[seed]||"",free:false}));for(let i=0;i<slots.length;i+=2){if(slots[i].name&&!slots[i+1].name)slots[i].free=true;if(slots[i+1].name&&!slots[i].name)slots[i+1].free=true}return slots}
function resolvedWinner(r,m){return picks[key(r,m)]?.name||""}function participant(r,m,s,initial){if(r===0)return initial[m*2+s]||{name:"",seed:"",free:false};return{name:resolvedWinner(r-1,m*2+s),seed:"",free:false}}function autoAdvance(initial){const matches=bracketSlots(entrantCount)/2;for(let m=0;m<matches;m++){const a=initial[m*2],b=initial[m*2+1];if(a.name&&!b.name)picks[key(0,m)]={name:a.name,side:0,auto:true};else if(b.name&&!a.name)picks[key(0,m)]={name:b.name,side:1,auto:true}}}function clearForward(r,m){const rounds=roundsFor(entrantCount);while(r<rounds){delete picks[key(r,m)];m=Math.floor(m/2);r++}}function choose(r,m,s,initial){const A=participant(r,m,0,initial),B=participant(r,m,1,initial);if(!A.name||!B.name)return;const cur=picks[key(r,m)];if(cur&&!cur.auto&&cur.side===s)clearForward(r,m);else{clearForward(r,m);picks[key(r,m)]={name:s===0?A.name:B.name,side:s,auto:false}}autoAdvance(initial);render()}
function addTitle(text,x){const d=document.createElement("div");d.className="roundTitle";d.style.left=x+"px";d.textContent=text;titleLayer.appendChild(d)}
function makePlayer({id,x,y,seed,name,r,m,s,initial}){const d=document.createElement("div");d.className="player";d.id=id;d.style.left=x+"px";d.style.top=y+"px";const p=picks[key(r,m)];if(p&&name){if(p.name===name)d.classList.add("winner");else if(participant(r,m,1-s,initial).name)d.classList.add("loser")}const sd=document.createElement("div");sd.className="seed";sd.textContent=seed||"";const line=document.createElement("div");line.className="line";const nm=document.createElement("div");nm.className="name";nm.textContent=name||"";line.appendChild(nm);d.append(sd,line);if(name&&!(r===0&&p?.auto))d.addEventListener("click",()=>choose(r,m,s,initial));playerLayer.appendChild(d)}
function render(){playerLayer.innerHTML="";titleLayer.innerHTML="";svg.innerHTML="";const size=bracketSlots(entrantCount),rounds=roundsFor(entrantCount),initial=buildInitialSlots();autoAdvance(initial);const startX=35,lineYTop=70,contentHeight=Math.max(720,size*44);stage.style.height=contentHeight+90+"px";const effectiveGap=Math.min(285,(1160-startX)/rounds);for(let r=0;r<rounds;r++)addTitle(getRoundLabel(r),startX+r*effectiveGap);addTitle("CHAMPION",startX+rounds*effectiveGap);for(let r=0;r<rounds;r++){const count=size/Math.pow(2,r+1),stride=contentHeight/count,x=startX+r*effectiveGap;for(let m=0;m<count;m++){const center=lineYTop+stride*(m+.5),pairOffset=Math.min(26,stride*.22);for(let s=0;s<2;s++){const part=participant(r,m,s,initial),y=center+(s===0?-pairOffset:pairOffset)-17,id=`p-${r}-${m}-${s}`;makePlayer({id,x,y,seed:r===0&&part.name?part.seed:"",name:part.name,r,m,s,initial})}}}requestAnimationFrame(()=>{const sr=stage.getBoundingClientRect();for(let r=0;r<rounds-1;r++){const count=size/Math.pow(2,r+1);for(let m=0;m<count;m++){const from=document.getElementById(`p-${r}-${m}-0`),from2=document.getElementById(`p-${r}-${m}-1`),target=document.getElementById(`p-${r+1}-${Math.floor(m/2)}-${m%2}`);if(!from||!from2||!target)continue;const A=from.getBoundingClientRect(),B=from2.getBoundingClientRect(),T=target.getBoundingClientRect(),x1=Math.max(A.right,B.right)-sr.left,y1=(A.bottom+B.bottom)/2-sr.top,x2=T.left-sr.left+42,y2=T.bottom-sr.top,xm=x1+(x2-x1)*.5,p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",`M ${x1} ${y1} H ${xm} V ${y2} H ${x2}`);svg.appendChild(p)}}});const champ=resolvedWinner(rounds-1,0),cn=document.getElementById("champName");cn.textContent=champ||"Awaiting Winner";cn.classList.toggle("empty",!champ)}
function fisherYates(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function parsedNames(){return document.getElementById("rawNames").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)}function updateStatus(msg){const selected=Number(document.getElementById("teamCount").value),names=parsedNames(),s=document.getElementById("listStatus");if(msg){s.textContent=msg;return}s.textContent=`Selected: ${selected} entrants • Names entered: ${names.length}`}
document.getElementById("rawNames").addEventListener("input",()=>updateStatus());
document.getElementById("teamCount").addEventListener("change",e=>{entrantCount=Number(e.target.value);entrants=Array(entrantCount).fill("");original=[];picks={};render();updateStatus()});
document.getElementById("randomizeDirect").addEventListener("click",()=>{const selected=Number(document.getElementById("teamCount").value),names=parsedNames();if(names.length!==selected){updateStatus(`⚠ Selected ${selected}, but entered ${names.length} names.`);return}if(new Set(names.map(x=>x.toLowerCase())).size!==names.length){updateStatus("⚠ Duplicate names found.");return}entrantCount=selected;entrants=fisherYates(names);original=[...names];picks={};render();updateStatus(`✓ Randomized ${selected} entrants. Click again to reshuffle.`)});
document.getElementById("clear").addEventListener("click",()=>{picks={};render();updateStatus("Winner selections cleared.")});
document.getElementById("reset").addEventListener("click",()=>{entrants=Array(entrantCount).fill("");original=[];picks={};render();updateStatus("Bracket cleared. Pasted names remain above.")});
window.addEventListener("resize",render);updateStatus();render();
</script></body></html>
